name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --features cli -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --features cli
      - name: Build library
        run: cargo build --locked -p eqswift
      - name: Examples
        run: |
          cargo build --manifest-path examples/demo/Cargo.toml
          cargo build --manifest-path examples/otto-ffi/Cargo.toml

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build demo library
        run: CARGO_TARGET_DIR=target cargo build --manifest-path examples/demo/Cargo.toml
      - name: Generate Swift bindings
        working-directory: examples/demo
        run: CARGO_TARGET_DIR=../../target cargo run --locked --manifest-path ../../Cargo.toml -p cargo-eqswift -- eqswift swift --out-dir ../../swift/Generated
      - name: Check generated API
        run: |
          grep -q 'public func add' swift/Generated/eqswift_demo.swift
          grep -q 'public struct Person' swift/Generated/eqswift_demo.swift
          grep -q 'open class Greeter' swift/Generated/eqswift_demo.swift
          grep -q 'module eqswift_demoFFI' swift/Generated/module.modulemap
      - name: Build sample Swift package
        working-directory: swift
        run: swift build
