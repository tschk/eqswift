[package]
name = "otto-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "otto_ffi"

[dependencies]
eqswift = { path = "../../eq-swift" }
uniffi = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
