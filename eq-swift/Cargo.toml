[package]
name = "eqswift"
version = "0.1.3"
edition = "2021"
authors = ["Max Carter <max@undivisible.dev>"]
description = "Zero-config Rust-to-Swift FFI — no UDL, no build.rs, just annotations"
license = "ISC"
repository = "https://github.com/tschk/eqswift"
keywords = ["ffi", "swift", "uniffi", "bindings", "ios"]
categories = ["development-tools::ffi"]
rust-version = "1.87"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
cli = ["uniffi/cli"]

[dependencies]
eqswift-macros = { version = "0.1.3", path = "../eqswift-macros" }
uniffi = { version = "0.32" }

[dev-dependencies]
tempfile = "3.10"